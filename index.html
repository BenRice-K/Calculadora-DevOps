<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Promedios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculadora-card {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
        }
        input[type="number"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Asegura que el padding no desborde */
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }
        button:hover {
            background-color: #0056b3;
        }
        #resultado {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #e9ecef;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            display: none; /* Oculto por defecto */
        }
        .error {
            color: #dc3545;
            background-color: #f8d7da;
        }
        .exito {
            color: #155724;
            background-color: #d4edda;
        }
    </style>
</head>
<body>

    <div class="calculadora-card">
        <h2>Calculadora de Promedio Ponderado</h2>
        
        <div class="form-group">
            <label for="nota1">Nota 1 (10%):</label>
            <input type="number" id="nota1" min="1" max="100" placeholder="Ej: 85">
        </div>
        <div class="form-group">
            <label for="nota2">Nota 2 (20%):</label>
            <input type="number" id="nota2" min="1" max="100" placeholder="Ej: 90">
        </div>
        <div class="form-group">
            <label for="nota3">Nota 3 (30%):</label>
            <input type="number" id="nota3" min="1" max="100" placeholder="Ej: 75">
        </div>
        <div class="form-group">
            <label for="nota4">Nota 4 (40%):</label>
            <input type="number" id="nota4" min="1" max="100" placeholder="Ej: 80">
        </div>

        <button onclick="procesarNotas()">Calcular Promedio</button>

        <div id="resultado"></div>
    </div>

    <script>
        
        function calcularPromedioLocal(nota1, nota2, nota3, nota4) {
            const notas = [nota1, nota2, nota3, nota4];

            for (const nota of notas) {
                if (nota === undefined || nota === null || isNaN(nota)) {
                    throw new Error("Todas las notas son requeridas");
                }
                if (typeof nota !== "number" || nota < 1 || nota > 100) {
                    throw new Error("Las notas deben estar entre 1 y 100");
                }
            }

            const promedio = nota1 * 0.1 + nota2 * 0.2 + nota3 * 0.3 + nota4 * 0.4;
            return Math.round(promedio * 10) / 10;
        }

        function procesarNotas() {
            const divResultado = document.getElementById('resultado');
            divResultado.style.display = 'block'; // Mostrar el div
            
            try {
                // Obtener valores de los inputs y convertirlos a números flotantes
                const n1 = parseFloat(document.getElementById('nota1').value);
                const n2 = parseFloat(document.getElementById('nota2').value);
                const n3 = parseFloat(document.getElementById('nota3').value);
                const n4 = parseFloat(document.getElementById('nota4').value);

                // Calcular usando la función local (espejo de app.js)
                const resultadoFinal = calcularPromedioLocal(n1, n2, n3, n4);

                // Mostrar éxito
                divResultado.className = 'exito';
                divResultado.innerHTML = `El promedio final es: <strong>${resultadoFinal}</strong>`;
                
            } catch (error) {
                // Mostrar error si la validación falla
                divResultado.className = 'error';
                divResultado.innerHTML = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
